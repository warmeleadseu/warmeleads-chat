name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type-check, lint & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      # Lint draait zichtbaar mee maar blokkeert (nog) niet: er is bestaande
      # lint-schuld (voornamelijk no-explicit-any) die in fase 9 wordt opgeruimd,
      # waarna deze stap blokkerend wordt gemaakt.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Test
        run: npm run test

  # Het Vercel-project is niet via de Vercel GitHub-app gekoppeld, dus deployen we
  # hier zelf: elke groene push naar main gaat live op warmeleads.eu.
  deploy:
    name: Deploy naar Vercel (productie)
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: team_ngxvcy0uY4agKh6L1RsH5SrJ
      VERCEL_PROJECT_ID: prj_1BiSJ71o8UVRB0jHmrGH7q2jBGSK
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::Secret VERCEL_TOKEN ontbreekt; deploy overgeslagen."
            exit 0
          fi
          npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
