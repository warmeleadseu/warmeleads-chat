name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type-check, lint & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      # Lint draait zichtbaar mee maar blokkeert (nog) niet: er is bestaande
      # lint-schuld (voornamelijk no-explicit-any) die in fase 9 wordt opgeruimd,
      # waarna deze stap blokkerend wordt gemaakt.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Test
        run: npm run test
